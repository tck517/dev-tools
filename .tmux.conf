# Default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Prefix Configuration
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# General Settings
set -sg escape-time 0
set-option -g default-terminal "screen-256color"
setw -g wrap-search on
setw -g word-separators ' -_@'

# Status Bar Configuration
set-option -g status "on"
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# Starship-inspired Colorscheme
# Default statusbar colors (dark bg, white text — matches terminal)
set-option -g status-style bg=colour235,fg=colour250

# Default window title colors
set-window-option -g window-status-style bg=colour235,fg=colour245

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour235,fg=colour214

# Active window title colors (bold cyan — matches Starship directory)
set-window-option -g window-status-current-style bg=colour235,fg=colour51,bold

# Pane border colors (subtle borders, muted blue/gold active)
set -g pane-border-style 'fg=colour238'
# One continuous divider (no half-coloured border with two panes) whose colour
# shows which side is active: soft blue on the left, soft gold on the right
set -g pane-border-indicators off
set -g pane-active-border-style '#{?pane_at_left,fg=colour110,fg=colour186}'

# Show pane titles on the top border; <prefix> T to rename.
# Use a per-pane user option (@pane_label) so TUI apps that emit OSC 0/2
# (claude, nvim, ssh remotes) can't clobber the title you set.
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} #{?#{==:#{@pane_label},},#{pane_title},#{@pane_label}} '
bind T command-prompt -p "Pane title:" "set-option -p @pane_label '%%'"

# Message colors
set-option -g message-style bg=colour235,fg=colour51
set-option -g message-command-style bg=colour235,fg=colour51

# Pane number display
set-option -g display-panes-active-colour colour51
set-option -g display-panes-colour colour238

# Clock (green — matches Starship success prompt)
set-window-option -g clock-mode-colour colour76

# Bell (red — matches Starship error prompt)
set-window-option -g window-status-bell-style bg=colour235,fg=colour196

# Window styles
set -g window-style 'fg=colour250,bg=colour235'
set -g window-active-style 'fg=colour254,bg=black'

# Status bar content (Starship-style: green session, cyan active window, purple accents)
set-option -g status-right "#[fg=colour214]%Y-%m-%d #[fg=colour141]%H:%M #[fg=colour245] #h "
set-window-option -g window-status-current-format "#[fg=colour51,bold] #I:#W#[nobold] "
set-window-option -g window-status-format "#[fg=colour245] #I:#W "

# Key Bindings for splits with current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Turn on activity + bell monitoring in all windows
set -g monitor-activity on
set -g monitor-bell on

# Only alert for *non-current* windows. "other" means not the session's own
# current window, so a single-window background session never qualifies;
# bells use "any" and the alert-bell hook below skips the window you're on.
set -g activity-action other
set -g bell-action any

# When there is activity/bell, send a real BEL to the terminal
# (instead of tmux just printing a status message)
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Cross-session alerts: the window list only covers the current session, so
# list *other* sessions with alerts in status-left. Orange = unseen output
# (activity), red + "!" = bell (e.g. Claude Code finished / needs input).
# Flags clear once you visit the window.
set -g @alert_sessions '#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{session_alerts}},#{?#{m:*!*,#{session_alerts}},#[fg=colour196]#{session_name}!,#[fg=colour214]#{session_name}} ,}}'
set-option -g status-left "#[fg=colour76,bold] #S #[nobold]#{E:@alert_sessions}#[fg=colour238]│ "
# Other sessions' alerts only reach this client's status line on redraw
set -g status-interval 5

# macOS notification when a background window rings the bell
set-hook -g alert-bell {
  if-shell -F '#{&&:#{session_attached},#{window_active}}' '' {
    run-shell -b "osascript -e 'display notification \"#{session_name} needs you\" with title \"tmux\"'"
  }
}

# <prefix> a: jump to a session/window that has an alert
bind a choose-tree -Zs -f '#{session_alerts}'


# Mouse / trackpad: scroll panes + Claude chat directly (no prefix + arrows)
set -g mouse on

# mdfried/Kitty graphics inside tmux (header images via Unicode placeholders)
set -g allow-passthrough on
